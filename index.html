<script>
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'hi-IN';
    recognition.interimResults = false;

    function startVoice() {
        document.getElementById('statusText').innerText = "LISTENING · Tap arrow when you're done";
        recognition.start();
    }

    recognition.onresult = function(event) {
        document.getElementById('userInput').value = event.results.transcript;
        document.getElementById('statusText').innerText = "";
    };

    function showPreview() {
        const input = document.getElementById('imageInput');
        if (input.files && input.files[0]) {
            document.getElementById('statusText').innerText = "Document Selected: " + input.files[0].name + " 📷";
        }
    }

    function clickChip(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        window.speechSynthesis.speak(utterance);
    }

    async function sendMessage() {
        const textInput = document.getElementById('userInput');
        const fileInput = document.getElementById('imageInput');
        const chatBox = document.getElementById('chatBox');
        const frontView = document.getElementById('frontView');
        
        let userText = textInput.value.trim();
        let fileSelected = fileInput.files && fileInput.files[0];
        
        // अगर कुछ भी इनपुट नहीं है तो रुक जाएं
        if (!userText && !fileSelected) return;

        // फ्रंट व्यू को छिपाएं और चैट बॉक्स को दिखाएं
        if(frontView) frontView.style.display = 'none';
        if(chatBox) chatBox.style.display = 'block';

        // यूजर का मैसेज स्क्रीन पर जोड़ें
        chatBox.innerHTML += `<div class="msg user">${userText || "Uploading Document... 📷"}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        const formData = new FormData();
        formData.append('text', userText);
        if (fileSelected) {
            formData.append('image', fileInput.files[0]);
        }

        // इनपुट फील्ड्स को खाली करें
        textInput.value = '';
        fileInput.value = '';
        document.getElementById('statusText').innerText = '';

        // लोडिंग मैसेज दिखाएं
        chatBox.innerHTML += `<div class="msg ai" id="loading">Ji Boss, check kar raha hoon... ⏳</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/chat', { method: 'POST', body: formData });
            const data = await response.json();
            
            if(document.getElementById('loading')) document.getElementById('loading').remove();

            if (data.response) {
                chatBox.innerHTML += `<div class="msg ai">${data.response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                speak(data.response);
            } else {
                chatBox.innerHTML += `<div class="msg ai">Error: ${data.error || "Kuch dikkat aayi, Boss!"}</div>`;
            }
        } catch (err) {
            if(document.getElementById('loading')) document.getElementById('loading').remove();
            chatBox.innerHTML += `<div class="msg ai">Server connection lost, Boss!</div>`;
        }
    }
       </script>
