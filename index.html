<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNDAY AI v3.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #05140b 0%, #020a05 100%);
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .main-container {
            max-width: 500px;
            width: 100%;
            margin: 40px auto auto auto;
            text-align: center;
            flex: 1;
        }
        /* बॉस, यह रहा आपका शानदार गोल ग्रीन लोगो */
        .nucleus {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nucleus-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #10b981;
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.4;
        }
        .nucleus-core {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            box-shadow: 0 0 25px #10b981;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }
        h1 span { color: #10b981; }
        .subtitle {
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .desc {
            font-size: 12px;
            color: #6b7280;
            max-width: 360px;
            margin: 0 auto 32px auto;
            line-height: 1.6;
        }
        .chat-output-area {
            max-width: 500px;
            width: 100%;
            margin: 20px auto;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            max-width: 85%;
            line-height: 1.5;
        }
        .user-msg {
            background: #10b981;
            color: white;
            align-self: flex-end;
        }
        .ai-msg {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e5e7eb;
            align-self: flex-start;
        }
        .cards-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(255, 255, 255, 0.04);
        }
        .card-tag {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: #10b981;
            letter-spacing: 1px;
        }
        .card-text {
            font-size: 14px;
            color: #e5e7eb;
            margin-top: 4px;
            font-weight: 500;
        }
        .card-arrow { color: #10b981; font-size: 18px; font-weight: bold; }
        .footer-container {
            max-width: 500px;
            width: 100%;
            margin: 24px auto 0 auto;
        }
        .input-box-wrapper {
            background: #09140e;
            border: 1px solid #142c1f;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .main-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            outline: none;
            font-size: 14px;
            padding: 4px;
        }
        .main-input::placeholder { color: #4b5563; }
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.02);
            padding-top: 8px;
        }
        .buttons-group { display: flex; align-items: center; gap: 8px; }
        .mic-btn { background: transparent; border: none; font-size: 16px; cursor: pointer; }
        .send-btn {
            background: #10b981;
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div id="welcome-screen">
            <!-- ग्रीन ग्लोइंग गोल मार्क लोगो -->
            <div class="nucleus">
                <div class="nucleus-glow"></div>
                <div class="nucleus-core"></div>
            </div>
            <h1>SUNDAY AI<span>.</span></h1>
            <p class="subtitle">A calmer way to think through a trade.</p>
            <p class="desc">Ask Sunday to explain market moves, compare trading concepts, or pressure-test the risks behind an idea.</p>
            
            <div class="cards-group">
                <div class="glass-card" onclick="setCommand('Explain a market move in plain language')">
                    <div>
                        <div class="card-tag">Market Context</div>
                        <div class="card-text">Explain a market move in plain language</div>
                    </div>
                    <div class="card-arrow">↘</div>
                </div>
            </div>
        </div>

        <div id="chat-output" class="chat-output-area"></div>
    </div>

    <div class="footer-container">
        <div class="input-box-wrapper">
            <input type="text" id="chat-input" placeholder="Command, boss..." class="main-input">
            <div class="action-row">
                <div class="buttons-group">
                    <button class="mic-btn">🎙️</button>
                    <button class="send-btn" id="send-btn">↑</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setCommand(text) {
            document.getElementById('chat-input').value = text;
        }

        // आपका ओरिजिनल और सुरक्षित एआई चैट लॉजिक
        document.getElementById('send-btn').addEventListener('click', async () => {
            const inputField = document.getElementById('chat-input');
            const chatOutput = document.getElementById('chat-output');
            const welcomeScreen = document.getElementById('welcome-screen');
            const userText = inputField.value.trim();

            if (!userText) return;

            if (welcomeScreen) welcomeScreen.style.display = 'none';

            const userMessage = document.createElement('div');
            userMessage.className = 'message user-msg';
            userMessage.innerText = userText;
            chatOutput.appendChild(userMessage);
            inputField.value = '';

            const aiMessage = document.createElement('div');
            aiMessage.className = 'message ai-msg';
            aiMessage.innerText = 'Boss, Sunday AI सोच रहा है...';
            chatOutput.appendChild(aiMessage);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });
                const data = await response.json();
                aiMessage.innerText = data.reply || 'कोई जवाब नहीं मिला, बॉस।';
            } catch (error) {
                aiMessage.innerText = 'कनेक्शन एरर आया बॉस, कृपया दोबारा ट्राई करें।';
            }
            window.scrollTo(0, document.body.scrollHeight);
        });

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('send-btn').click();
            }
        });
    </script>
</body>
                             </html>
