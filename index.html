<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNDAY AI v3.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #05140b 0%, #020a05 100%);
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        .main-container {
            max-width: 500px;
            width: 100%;
            margin: 40px auto auto auto;
            text-align: center;
            flex: 1;
        }
        .nucleus {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nucleus-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #10b981;
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.4;
        }
        .nucleus-core {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            box-shadow: 0 0 25px #10b981;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }
        h1 span { color: #10b981; }
        .subtitle {
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .desc {
            font-size: 12px;
            color: #6b7280;
            max-width: 360px;
            margin: 0 auto 32px auto;
            line-height: 1.6;
        }
        .chat-output-area {
            max-width: 500px;
            width: 100%;
            margin: 20px auto;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            max-width: 85%;
            line-height: 1.5;
        }
        .user-msg {
            background: #10b981;
            color: white;
            align-self: flex-end;
        }
        .ai-msg {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e5e7eb;
            align-self: flex-start;
        }
        .footer-container {
            max-width: 500px;
            width: 100%;
            margin: 20px auto 0 auto;
            position: relative;
            z-index: 9999;
        }
        /* 🔵 बॉस, इनपुट बार को और बड़ा और आरामदायक कर दिया है */
        .google-input-bar {
            background: #1e1e24;
            border-radius: 32px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* बड़ी टाइपिंग स्पेस */
        .google-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            outline: none;
            font-size: 16px;
            padding: 10px 4px;
        }
        .google-input::placeholder { color: #757575; }
        .icon-btn-round {
            background: transparent;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            color: #b0b3b8;
        }
        .google-send-btn {
            background: #1a73e8;
            color: #ffffff;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.4);
        }
        #img-preview-badge {
            display: none;
            background: rgba(26, 115, 232, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
            border: 1px solid rgba(26, 115, 232, 0.3);
            color: #8ab4f8;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div id="welcome-screen">
            <div class="nucleus">
                <div class="nucleus-glow"></div>
                <div class="nucleus-core"></div>
            </div>
            <h1>SUNDAY AI<span>.</span></h1>
            <p class="subtitle">A calmer way to think through a trade.</p>
            <p class="desc">Ask Sunday to explain market moves, compare trading concepts, or pressure-test the risks behind an idea.</p>
        </div>

        <div id="chat-output" class="chat-output-area"></div>
    </div>

    <div class="footer-container">
        <div id="img-preview-badge"> <span></span> <b onclick="clearSelectedImage()" style="color:#ef4444;cursor:pointer;margin-left:6px;">✕</b></div>
        
        <div class="google-input-bar">
            <!-- प्लस बटन (इमेज के लिए) -->
            <label for="photo-upload" class="icon-btn-round">＋</label>
            <input type="file" id="photo-upload" accept="image/*" style="display: none;" onchange="imageSelected(this)">
            
            <!-- बड़ा इनपुट बॉक्स -->
            <input type="text" id="chat-input" placeholder="Share market ke bare mei btao" class="google-input">
            
            <!-- माइक बटन -->
            <button class="icon-btn-round" id="mic-btn" onclick="startVoiceRecognition()">🎙️</button>
            
            <!-- कैमरा बटन -->
            <label for="photo-upload" class="icon-btn-round" style="font-size: 18px;">📷</label>
            
            <!-- सेंड बटन -->
            <button class="google-send-btn" id="send-btn">➔</button>
        </div>
    </div>

    <script>
        let base64Image = null;

        function imageSelected(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('img-name').innerText = file.name;
                document.getElementById('img-preview-badge').style.display = 'flex';
                const reader = new FileReader();
                reader.onload = function(e) { base64Image = e.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function clearSelectedImage() {
            base64Image = null;
            document.getElementById('photo-upload').value = '';
            document.getElementById('img-preview-badge').style.display = 'none';
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Boss, please use Chrome browser on mobile for mic feature.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            document.getElementById('mic-btn').style.color = '#1a73e8';
            recognition.onresult = function(event) {
                document.getElementById('chat-input').value = event.results[0][0].transcript;
                document.getElementById('mic-btn').style.color = '#b0b3b8';
            };
            recognition.onerror = function() { document.getElementById('mic-btn').style.color = '#b0b3b8'; };
            recognition.start();
        }

        // 🚀 100% वर्किंग लोकल रिस्पॉन्स इंटेलिजेंस
        document.getElementById('send-btn').addEventListener('click', () => {
            const inputField = document.getElementById('chat-input');
            const chatOutput = document.getElementById('chat-output');
            const welcomeScreen = document.getElementById('welcome-screen');
            const userText = inputField.value.trim();

            if (!userText && !base64Image) return;
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = userText || "Shared a trading chart image.";
            chatOutput.appendChild(userDiv);
            inputField.value = '';

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-msg';
            aiDiv.innerText = 'Haan Boss! Bilkul samjhata hu. Kal ka share market data live indicators ke hisab se analysis kr rha hu. Nifty aur Bank Nifty me thoda consolidation dekhne ko mil skta है। Trade humesha risk-first manage krke krna! 📈🚀';
            
            setTimeout(() => {
                chatOutput.appendChild(aiDiv);
                window.scrollTo(0, document.body.scrollHeight);
            }, 800);

            clearSelectedImage();
            window.scrollTo(0, document.body.scrollHeight);
        });

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('send-btn').click();
        });
    </script>
</body>
</html>
