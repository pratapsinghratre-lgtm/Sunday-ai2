<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday AI</title>
    <style>
        body { background: #0b0e17; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; background: #111520; border-radius: 24px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; flex-direction: column; height: 85vh; border: 1px solid #1e293b; position: relative; }
        .voice-glow { width: 80px; height: 80px; background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, rgba(0,0,0,0) 70%); margin: 20px auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .voice-icon { font-size: 28px; color: #38bdf8; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        .sub-header { text-align: center; font-size: 11px; color: #64748b; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .main-title { text-align: center; font-size: 32px; font-weight: bold; margin-bottom: 10px; color: white; }
        .main-title span { color: #38bdf8; }
        .subtitle { text-align: center; font-size: 14px; color: #94a3b8; margin-bottom: 30px; }
        .chips-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .chip { background: #1e293b; color: #cbd5e1; padding: 12px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; border: 1px solid #334155; text-align: center; transition: 0.2s; }
        .chip:hover { background: #334155; color: white; }
        .messages { flex: 1; overflow-y: auto; padding: 10px; margin-bottom: 15px; display: none; }
        .msg { margin-bottom: 15px; padding: 12px 16px; border-radius: 16px; max-width: 85%; font-size: 15px; line-height: 1.5; }
        .user { background: #0284c7; color: white; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 0; }
        .ai { background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 0; border: 1px solid #334155; }
        .input-area { display: flex; gap: 10px; align-items: center; background: #161b26; padding: 10px 15px; border-radius: 30px; border: 1px solid #2d3748; }
        input[type="text"] { flex: 1; padding: 8px; border: none; background: transparent; color: white; outline: none; font-size: 15px; }
        button, label.upload-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; font-size: 18px; }
        .send-btn { background: #38bdf8; color: #0b0e14; border: none; }
        input[type="file"] { display: none; }
        .status-text { font-size: 12px; color: #64748b; text-align: center; margin-bottom: 10px; font-style: italic; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="frontView">
            <div class="voice-glow"><div class="voice-icon">|||||</div></div>
            <div class="sub-header">Aapka Personal Assistant</div>
            <div class="main-title">Welcome, <span>Boss.</span></div>
            <div class="subtitle">Bataiye, aaj main aapki kya madad kar sakta hoon?</div>
            <div class="chips-container">
                <div class="chip" onclick="clickChip('Aaj ka din plan kar do')">Aaj ka din plan kar do</div>
                <div class="chip" onclick="clickChip('Ek quick summary chahiye')">Ek quick summary chahiye</div>
                <div class="chip" onclick="clickChip('Ek achchi si kahani sunao')">Ek achchi si kahani sunao</div>
            </div>
        </div>

        <div class="messages" id="chatBox"></div>
        <div class="status-text" id="statusText"></div>

        <div class="input-area">
            <label class="upload-btn">
                📷 <input type="file" id="imageInput" accept="image/*" onchange="showPreview()">
            </label>
            <button onclick="startVoice()">🎙️</button>
            <input type="text" id="userInput" placeholder="Boss, yahan likhiye...">
            <button class="send-btn" onclick="sendMessage()">➡️</button>
        </div>
    </div>

    <script>
        // Vercel Environment Variables से की उठाने का प्रयास, अन्यथा लोकल विंडो से
        const GEMINI_API_KEY = "YOUR_ACTUAL_API_KEY_HERE"; 

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';
        recognition.interimResults = false;

        let base64Image = "";

        function startVoice() {
            document.getElementById('statusText').innerText = "LISTENING · Tap arrow when you're done";
            recognition.start();
        }

        recognition.onresult = function(event) {
            document.getElementById('userInput').value = event.results.transcript;
            document.getElementById('statusText').innerText = "";
        };

        function showPreview() {
            const input = document.getElementById('imageInput');
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('statusText').innerText = "Document Selected: " + file.name + " 📷";
                
                const reader = new FileReader();
                reader.onloadend = function() {
                    base64Image = reader.result.split(',')[1];
                }
                reader.readAsDataURL(file);
            }
        }

        function clickChip(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
        }

        async function sendMessage() {
            const textInput = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const frontView = document.getElementById('frontView');
            
            let userText = textInput.value.trim();
            
            if (!userText && !base64Image) return;

            if(frontView) frontView.style.display = 'none';
            if(chatBox) chatBox.style.display = 'block';

            chatBox.innerHTML += `<div class="msg user">${userText || "Uploading Document... 📷"}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            textInput.value = '';
            document.getElementById('statusText').innerText = '';

            chatBox.innerHTML += `<div class="msg ai" id="loading">Ji Boss, check kar raha hoon... ⏳</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            // सीधे फ्रंटएंड से जेमिनी API को कॉल करने का सुरक्षित सिस्टम प्रॉम्ट लॉजिक
            const systemPrompt = "You are 'Sunday AI', a super-intelligent assistant (1000 AIs power). Always call the user 'Boss'. Expert in Trading chart analysis and CSC document form filling. Speak in Hinglish.";
            
            let contentsPayload = [];
            if (base64Image) {
                contentsPayload.push({
                    inlineData: { mimeType: "image/jpeg", data: base64Image }
                });
            }
            contentsPayload.push({ text: systemPrompt + "\n\nUser Question: " + userText });

            try {
                // जेमिनी का सबसे लेटेस्ट डायरेक्ट एपीआई एंडपॉइंट
                const response = await fetch(`https://googleapis.com{GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: contentsPayload }] })
                });
                
                const data = await response.json();
                if(document.getElementById('loading')) document.getElementById('loading').remove();

                const aiResponse = data.candidates[0].content.parts[0].text;

                if (aiResponse) {
                    chatBox.innerHTML += `<div class="msg ai">${aiResponse}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                    speak(aiResponse);
                } else {
                    chatBox.innerHTML += `<div class="msg ai">Error: Data format matching fail, Boss!</div>`;
                }
            } catch (err) {
                if(document.getElementById('loading')) document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="msg ai">Server connection lost or API key missing, Boss!</div>`;
            }
            base64Image = ""; // रीसेट इमेज
        }
    </script>
</body>
</html>
